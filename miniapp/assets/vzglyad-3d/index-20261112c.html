<!doctype html><html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>СИЛА И ЧЕСТЬ — 3D обзор 360°</title><style>html,body{margin:0;background:#0e0f12;color:#f1eeea;font:14px system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}canvas{width:100vw;height:100dvh;display:block;touch-action:none}.info{position:absolute;top:10px;left:10px;z-index:2;background:rgba(11,11,14,.84);border:1px solid rgba(185,178,170,.24);padding:6px 10px;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;pointer-events:none;backdrop-filter:blur(8px)}.loader{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 42%,rgba(24,26,31,.72),rgba(11,12,15,.92));pointer-events:none;transition:opacity .28s ease}.loader.is-ready{opacity:0}.loader span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#d9d3ca}.loader-track{width:136px;height:2px;background:rgba(255,255,255,.14);overflow:hidden}.loader-fill{width:18%;height:100%;background:#d63b34;transition:width .15s ease}.buttons{position:absolute;bottom:10px;left:10px;right:10px;z-index:2;display:flex;gap:6px}button{flex:1;background:rgba(14,14,17,.88);color:#e6e1da;border:1px solid rgba(185,178,170,.28);padding:9px 8px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:border-color .18s,background .18s,color .18s;-webkit-tap-highlight-color:transparent}button:active,button.is-active{border-color:#d63b34;background:rgba(214,59,52,.24);color:#fff}button:focus-visible{outline:2px solid #ef594f}</style></head><body><div class="info" id="status">ЗАГРУЗКА 3D…</div><div class="loader" id="loader"><span id="loaderLabel">ЗАГРУЗКА 3D МОДЕЛИ</span><div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div></div><div class="buttons"><button id="front" class="is-active" type="button">Перед</button><button id="back" type="button">Спина</button><button id="spin" type="button">Авто 360°</button></div><script type="module" src="viewer-20261112c.bundle.js"></script></body></html>
