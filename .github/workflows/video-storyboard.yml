name: video-storyboard
on:
  push:
    branches: [arena/01a08bf6-vorozhbitov-shop-001]
    paths: [.github/workflows/video-storyboard.yml, storyboard-request]
env:
  FILES: 'miniapp/assets/video/welcome-final-30s.mp4 miniapp/assets/video/campaign-v6.mp4'
jobs:
  storyboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: tools
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -version | head -1
      - name: storyboard
        run: |
          mkdir -p storyboard
          {
            for f in $FILES; do echo "== $f"; ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f"; done
            for f in $FILES; do
              base=$(basename "$f" .mp4)
              echo "== sheet $base"
              ffmpeg -y -v error -i "$f" -frames:v 1 -vf "fps=1,scale=320:-1,tile=5x6" "storyboard/$base-sheet.jpg" && echo OK || echo FAIL
            done
            echo "== welcome head strip"
            ffmpeg -y -v error -i miniapp/assets/video/welcome-final-30s.mp4 -t 3 -frames:v 1 -vf "fps=10,scale=320:-1,tile=10x3" storyboard/welcome-head.jpg && echo OK || echo FAIL
            echo "== scene cuts"
            for f in $FILES; do
              base=$(basename "$f" .mp4)
              ffmpeg -nostdin -v info -i "$f" -filter:v "select='gt(scene,0.4)',showinfo" -f null - 2>&1 | grep -o "pts_time:[0-9.]*" > "storyboard/$base-cuts.txt" || true
              wc -l "storyboard/$base-cuts.txt"
            done
            ls -la storyboard/
          } 2>&1 | tee storyboard/build.log
      - name: commit
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@local"
          git add storyboard/
          git diff --cached --quiet && echo "no changes" || { git commit -m "storyboard: раскадровки видео"; git push origin HEAD:${{ github.ref_name }}; }
