name: video-storyboard
on:
  push:
    branches: [arena/01a08bf6-vorozhbitov-shop-001]
    paths: [.github/workflows/video-storyboard.yml, storyboard-request]
env:
  FILES: 'miniapp/assets/video/welcome-final-30s.mp4 miniapp/assets/video/campaign-v6.mp4'
jobs:
  storyboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: tools
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -version | head -1
      - name: storyboard
        run: |
          mkdir -p storyboard
          {
            for f in $FILES; do echo "== $f"; ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,nb_frames,codec_type -of default=noprint_wrappers=1 "$f"; done
            echo "== welcome span A [10,16]"
            ffmpeg -y -v error -ss 10 -t 6 -i miniapp/assets/video/welcome-final-30s.mp4 -frames:v 1 -vf "fps=5,scale=320:-1,tile=6x5" storyboard/welcome-span-a.jpg && echo OK || echo FAIL
            echo "== welcome span B [20,26]"
            ffmpeg -y -v error -ss 20 -t 6 -i miniapp/assets/video/welcome-final-30s.mp4 -frames:v 1 -vf "fps=5,scale=320:-1,tile=6x5" storyboard/welcome-span-b.jpg && echo OK || echo FAIL
            ls -la storyboard/
          } 2>&1 | tee storyboard/build.log
      - name: commit
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@local"
          git add storyboard/
          git diff --cached --quiet && echo "no changes" || { git commit -m "storyboard: раскадровки видео"; git push origin HEAD:${{ github.ref_name }}; }
