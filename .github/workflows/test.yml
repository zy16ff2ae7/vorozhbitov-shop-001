name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          # Root code/tests are included automatically; fetch only runtime
          # directories, not the multi-gigabyte source-media archives.
          sparse-checkout: |
            miniapp
            tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install optional media-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Python regressions
        run: python -m unittest discover -v
      - name: JavaScript syntax and regressions
        run: |
          node --check miniapp/app.js
          node --check miniapp/checkout.js
          node --check miniapp/shop-core.js
          node --check miniapp/viewer3d.js
          node --test test_shop_core.cjs test_checkout_client.cjs
      - name: Offline bot scenarios
        run: python smoke_test.py > smoke-test.log && tail -n 25 smoke-test.log
      - name: Catalog and release assets
        run: python tools/validate_release.py
      - name: Syntax and whitespace
        run: |
          python -m py_compile bot.py payments.py smoke_test.py test_bot.py test_regressions.py
          git diff --check
