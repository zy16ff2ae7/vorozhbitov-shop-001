name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          # Root code/tests are included automatically; fetch only runtime
          # directories, not the multi-gigabyte source-media archives.
          sparse-checkout: |
            miniapp
            tools
            approval
            custom_emoji_pack_v3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install optional media-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Python regressions
        run: python -m unittest discover -v
      - name: JavaScript syntax and regressions
        run: |
          node --check miniapp/app.js
          node --check miniapp/checkout.js
          node --check miniapp/shop-core.js
          node --check miniapp/viewer3d.js
          node --test test_shop_core.cjs test_checkout_client.cjs
      - name: Offline bot scenarios
        run: python smoke_test.py > smoke-test.log && tail -n 25 smoke-test.log
      - name: Catalog and release assets
        run: python tools/validate_release.py
      - name: Syntax and whitespace
        run: |
          python -m py_compile bot.py payments.py smoke_test.py test_bot.py test_regressions.py tools/container_smoke.py
          git diff --check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          sparse-checkout: |
            miniapp
            tools
      - name: Build runtime image
        run: docker build --tag vorozhbitov-shop:ci .
      - name: Smoke test without external network
        run: >-
          docker run --rm --network none
          --volume "$PWD/tools/container_smoke.py:/tmp/container_smoke.py:ro"
          vorozhbitov-shop:ci python /tmp/container_smoke.py

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          sparse-checkout: |
            miniapp
            tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Playwright (drives the runner's Chrome via channel)
        run: npm install --no-save playwright
      - name: Browser regressions against the preview server
        run: |
          python preview_server.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/api/catalog >/dev/null && break; sleep 1; done
          node tools/check_ui.cjs
